<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma Médica Digital - Panel de Usuario</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- inicio de secion -->
  <div id="login-view" class="view active">
    <div class="card login-card">
      <h2>Portal Pacientes</h2>
      <p>Ingresa tus datos para gestionar tus citas</p>
      <form id="login-form">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" required placeholder="paciente@salud.com" value="paciente@salud.com">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required placeholder="••••••••" value="123456">
        </div>
        <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
      </form>
    </div>
  </div>

  <!--inicio -->
  <div id="dashboard-view" class="view">
    <header class="navbar">
      <h1>SaludDigital</h1>
      <div class="user-info">
        <span id="user-email-display"></span>
        <button id="logout-btn" class="btn btn-secondary btn-sm">Cerrar Sesión</button>
      </div>
    </header>

    <main class="container">
      <section class="section-header">
        <h2>Gestión de Citas Médicas</h2>
        <p>Consulta, reagenda o cancela tus próximas consultas de manera sencilla.</p>
      </section>

      <!-- Panel de Alertas -->
      <div id="alert-box" class="alert hidden"></div>

      <!-- Listado de Citas -->
      <section class="appointments-section">
        <h3>Próximas Citas</h3>
        <div id="appointments-container" class="grid-appointments">
          <!-- Cargado dinámicamente -->
        </div>
      </section>
    </main>
  </div>

  <!-- Reagendar -->
  <div id="modal-reschedule" class="modal hidden">
    <div class="modal-content">
      <h3>Reagendar Cita</h3>
      <p id="modal-appointment-info"></p>
      <form id="reschedule-form">
        <input type="hidden" id="modal-appointment-id">
        <div class="form-group">
          <label for="new-date">Nueva Fecha</label>
          <input type="date" id="new-date" required>
        </div>
        <div class="form-group">
          <label for="new-time">Nueva Hora</label>
          <input type="time" id="new-time" required>
        </div>
        <div class="modal-actions">
          <button type="button" id="close-modal-btn" class="btn btn-secondary">Cancelar</button>
          <button type="submit" class="btn btn-primary">Confirmar Cambio</button>
        </div>
      </form>
    </div>
  </div>

  <script src="apiservice.js"></script>
  <script src="appstore.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
